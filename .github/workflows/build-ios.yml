name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant execute permissions for Gradle wrapper
        run: chmod +x gradlew

      - name: Setup Gradle (No Cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build KMP iOS Framework
        run: ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

      - name: Archive iOS App
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/iosApp.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r TextLector-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextLector-Unsigned-IPA
          path: build/TextLector-Unsigned.ipa
